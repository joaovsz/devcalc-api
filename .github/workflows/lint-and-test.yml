name: Lint and Test (Reusable)

on:
  workflow_call:
    inputs:
      run_tests:
        description: Executa os testes automatizados
        required: false
        type: boolean
        default: true
      run_lint:
        description: Executa verificacao de lint com Checkstyle
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Checkstyle)
    if: ${{ inputs.run_lint }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Lint com Checkstyle
        run: mvn -B -ntp org.apache.maven.plugins:maven-checkstyle-plugin:3.6.0:check -Dcheckstyle.config.location=google_checks.xml

      - name: Falha para depuração do lint
        run: exit 1

  test:
    name: Testes automatizados
    if: ${{ inputs.run_tests }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Rodar testes
        run: mvn -B -ntp test
