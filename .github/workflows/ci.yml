name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/lint-and-test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/lint-and-test.yml'
  workflow_dispatch:
    inputs:
      run_tests:
        description: Executar testes automatizados
        required: true
        type: boolean
        default: true
      run_lint:
        description: Executar lint (Checkstyle)
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: mvn -B -ntp clean install -DskipTests

  lint_and_test:
    name: Lint and Test
    needs: build
    uses: ./.github/workflows/lint-and-test.yml
    with:
      run_tests: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
      run_lint: ${{ github.event_name != 'workflow_dispatch' || inputs.run_lint }}

  sonar_scan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: [build, lint_and_test]
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v4.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  package:
    runs-on: ubuntu-latest
    needs: [build, lint_and_test, sonar_scan]
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Gerar JAR
        run: mvn -B -ntp package -DskipTests

  deploy:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Simular deploy
        run: echo "Deploy realizado com sucesso"
