name: Etapa 4 - Permissoes e Issue
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Simular Falha
        run: exit 1

      - name: Abrir Issue
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Falha no pipeline - ${{ github.actor }}" \
            --body "O workflow falhou no commit ${{ github.sha }}."